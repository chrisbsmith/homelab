---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snmp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: snmp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SNMP_USERNAME: "{{ .SNMP_USERNAME }}"
        SNMP_PASSWORD: "{{ .SNMP_PASS }}"
        SNMP_PRIVACY_PASSWORD: "{{ .SNMP_PRIVACY_PASS }}"
        NAS2_SNMP_USERNAME: "{{ .NAS2_SNMP_USERNAME }}"
        NAS2_SNMP_PASSWORD: "{{ .NAS2_SNMP_PASSWORD }}"
        NAS2_SNMP_PRIVACY_PASSWORD: "{{ .NAS2_SNMP_PRIVACY_PASSWORD }}"
        values.yaml: "{{ .SNMP_SERVICE_MONITOR }}"
  # Second NAS: individual fields from the snmp-nas2 item
  data:
    - secretKey: NAS2_SNMP_USERNAME
      remoteRef:
        key: snmp-nas2
        property: username
    - secretKey: NAS2_SNMP_PASSWORD
      remoteRef:
        key: snmp-nas2
        property: password
    - secretKey: NAS2_SNMP_PRIVACY_PASSWORD
      remoteRef:
        key: snmp-nas2
        property: privacy_password
  dataFrom:
    - extract:
        key: snmp
