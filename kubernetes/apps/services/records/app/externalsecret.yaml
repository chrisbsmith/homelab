---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: records
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: records-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DISCOGS_TOKEN: "{{ .DISCOGS_TOKEN }}"
  dataFrom:
    - extract:
        key: records
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: records-ghcr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: records-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .GHCR_USERNAME }}",
                "password": "{{ .GHCR_TOKEN }}",
                "auth": "{{ printf "%s:%s" .GHCR_USERNAME .GHCR_TOKEN | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: records
