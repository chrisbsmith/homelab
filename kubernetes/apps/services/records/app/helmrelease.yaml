---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: records
spec:
  chartRef:
    kind: OCIRepository
    name: records
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      records:
        # SQLite on a ReadWriteOnce volume: two pods must never hold the
        # database open at once.
        strategy: Recreate
        replicas: 1
        initContainers:
          # The CSI driver declares fsGroupPolicy: ReadWriteOnceWithFSType and
          # this StorageClass sets no fsType, so the kubelet skips applying
          # fsGroup and a fresh volume stays root:root 0755. The app runs as
          # 10001 and cannot create /data/covers or the database.
          #
          # Declaring fsType on the StorageClass is the real fix, but those
          # parameters are immutable once created, so it would mean deleting a
          # StorageClass that other apps use. This chown is scoped to one
          # volume instead.
          init-chown:
            image:
              repository: public.ecr.aws/docker/library/busybox
              tag: 1.37.0
            command:
              - sh
              - -c
              - chown -R 10001:10001 /data && chmod 0750 /data
            securityContext:
              # The only thing in this pod that runs as root, for one command.
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "FOWNER"]
        containers:
          app:
            image:
              repository: ghcr.io/chrisbsmith/records
              tag: 0.1.0
            env:
              DATA_DIR: /data
              PORT: &port 8000
              AUTH_MODE: none
              LOG_LEVEL: info
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: records-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: records-ghcr-pull
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: synology-csi-iscsi-retain
        size: 5Gi
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
