---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  diff:
    desc: Diff rendered Flux resources against main
    cmds:
      - flate diff all --path kubernetes/flux/cluster --base origin/main

  test:
    desc: Validate every Flux Kustomization and HelmRelease
    cmds:
      - flate test all --path kubernetes/flux/cluster
