---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flux Local

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Flux Local - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*

  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Local - Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run flux-local test
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: >-
            test
            --all-namespaces
            --enable-helm
            --path /github/workspace/kubernetes/flux/cluster
            --verbose

  diff:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Local - Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resource:
          - helmrelease
          - kustomization
      fail-fast: false
    steps:

      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          persist-credentials: false

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: default
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}


      - name: Run flux-local diff
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: >-
            diff ${{ matrix.resource }}
            --unified 6
            --path /github/workspace/pull/kubernetes/flux/cluster
            --path-orig /github/workspace/default/kubernetes/flux/cluster
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --sources "flux-system"
            --output-file diff.patch

      - name: Generate Diff
        id: diff
        run: |-
          echo 'diff<<EOF' >> $GITHUB_OUTPUT
          cat diff.patch >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resource }}
          message: |-
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  image-check:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Local - Image Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract Cluster Images
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: >-
            get cluster
            --path /github/workspace/kubernetes/flux/cluster
            --enable-images
            --only-images
            --output json
            --output-file /github/workspace/images.json

      - name: Install crane
        env:
          CRANE_VERSION: v0.20.6
        run: |-
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Validate Image Tags Exist
        run: |-
          python3 - <<'PY' > images.txt
          import json
          d = json.load(open("images.json"))
          def walk(x):
              if isinstance(x, str):
                  yield x
              elif isinstance(x, list):
                  for i in x:
                      yield from walk(i)
              elif isinstance(x, dict):
                  for v in x.values():
                      yield from walk(v)
          # keep image-like refs (have a registry path and a tag), drop bare digests
          imgs = sorted({s for s in walk(d) if "/" in s and ":" in s and not s.startswith("sha256:")})
          print("\n".join(imgs))
          PY
          echo "Checking $(grep -c . images.txt) images referenced by the cluster..."
          missing=()
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            if out=$(crane manifest "$img" 2>&1 >/dev/null); then
              echo "ok: $img"
            elif printf '%s' "$out" | grep -qiE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|not found|404'; then
              echo "MISSING: $img"
              missing+=("$img")
            else
              # auth errors, private registries, rate limits: warn, do not fail
              echo "::warning title=Unverified image::${img}: ${out}"
            fi
          done < images.txt
          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do
              echo "::error title=Image tag not found::${m} does not exist in its registry"
            done
            exit 1
          fi
          echo "All referenced image tags exist."

  success:
    if: ${{ !cancelled() }}
    needs:
      - test
      - diff
      - image-check
    name: Flux Local - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
