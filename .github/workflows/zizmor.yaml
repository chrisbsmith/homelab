---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Zizmor

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail the run on findings and annotate the PR, instead of uploading SARIF
      # to code scanning (which would need security-events: write). No `version`
      # input: the action only knows zizmor releases up to its own release, so a
      # separately-bumped pin breaks it. Renovate bumping the action bumps zizmor.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          annotations: true
