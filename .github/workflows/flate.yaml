---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: "0.6.5"
  FLATE_PATH: kubernetes/flux/cluster
  FLATE_NO_PROGRESS: "true"

jobs:
  filter:
    name: Flate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*

  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate - Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: ${{ env.FLATE_VERSION }}
          cache: "true"

      # The setup action exports FLATE_BASE; unset it so test covers the full tree
      - name: Run flate test
        run: unset FLATE_BASE && flate test all

  diff:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate - Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resource:
          - hr
          - ks
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: ${{ env.FLATE_VERSION }}
          cache: "true"

      # Informational only: `flate test` is the gate. A broken default branch (e.g. a
      # chart source that disappeared) fails the baseline render, and must not block
      # the PR that fixes it.
      - name: Run flate diff
        env:
          BASE: origin/${{ github.event.repository.default_branch }}
          RESOURCE: ${{ matrix.resource }}
        run: |-
          if ! flate diff "${RESOURCE}" --base "${BASE}" --output github > diff.txt 2> diff.err; then
            echo "::warning title=flate diff::$(head -c 1000 diff.err | tr '\n' ' ')"
          fi
          # GitHub caps comments at 65536 characters
          if [ "$(wc -c < diff.txt)" -gt 60000 ]; then
            head -c 60000 diff.txt > diff.trunc
            printf '\n... (truncated, run `flate diff %s --base %s` locally for the full diff)\n' "${RESOURCE}" "${BASE}" >> diff.trunc
            mv diff.trunc diff.txt
          fi

      - name: Generate Diff
        id: diff
        run: |-
          echo 'diff<<EOF' >> $GITHUB_OUTPUT
          cat diff.txt >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resource }}
          message: |-
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  image-check:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate - Image Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: ${{ env.FLATE_VERSION }}
          cache: "true"

      - name: Extract Cluster Images
        run: unset FLATE_BASE && flate get images > images.txt

      - name: Install crane
        env:
          CRANE_VERSION: v0.20.6
        run: |-
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Validate Image Tags Exist
        run: |-
          echo "Checking $(grep -c . images.txt) images referenced by the cluster..."
          missing=()
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            if out=$(crane manifest "$img" 2>&1 >/dev/null); then
              echo "ok: $img"
            elif printf '%s' "$out" | grep -qiE 'MANIFEST_UNKNOWN|NAME_UNKNOWN|not found|404'; then
              echo "MISSING: $img"
              missing+=("$img")
            else
              # auth errors, private registries, rate limits: warn, do not fail
              echo "::warning title=Unverified image::${img}: ${out}"
            fi
          done < images.txt
          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do
              echo "::error title=Image tag not found::${m} does not exist in its registry"
            done
            exit 1
          fi
          echo "All referenced image tags exist."

  success:
    if: ${{ !cancelled() }}
    needs:
      - test
      - diff
      - image-check
    name: Flate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "${RESULTS}"
